<!doctype html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="./content/css/css-reset.css">
  <link rel="stylesheet" href="./content/css/theme.css">
  <link rel="stylesheet" href="./content/css/header.css">
  <link rel="stylesheet" href="./content/css/modal.css">
  <link rel="stylesheet" href="./content/css/pagination.css">
  <title>شاپیفای | فروشگاه</title>
</head>
<body>
  <div class="main" style="max-width:1200px;margin:0 auto">
    <div id="headerMount"></div>
    
<div class="card" style="margin-top:14px">
  <div class="h1" style="margin-top:0">فروشگاه شاپیفای</div>
  <div class="row" style="justify-content:space-between">
    <div class="searchbar">
      <button class="btn" id="btnSearch">جست و جو</button>
      <input class="input" id="q" placeholder="جست و جو در محصولات..." />
    </div>
    <div class="muted" style="font-weight:900;align-self:center">محصولات افزوده شده توسط ادمین</div>
  </div>
</div>

<div class="card" style="margin-top:14px">
  <div id="grid" class="products-grid"></div>
  <div id="pager"></div>
</div>

<script>
let state = { page:1, limit:12, q:"" };
const el = (id)=>document.getElementById(id);

function productCard(p){
  const img = p.img ? `<img src="${p.img}">` : `<div class="muted" style="font-weight:1000">بدون عکس</div>`;
  return `<div class="pcard">
    <div class="pimg">${img}</div>
    <div class="pbody">
      <p class="pname">${p.title}</p>
      <div class="muted" style="font-weight:900">${Number(p.price||0).toLocaleString("fa-IR")} تومان</div>
      <div class="muted" style="margin-top:6px;font-weight:800">موجودی: ${p.count}</div>
    </div>
  </div>`;
}

async function load(){
  const data = await apiGet(`/api/products?q=${encodeURIComponent(state.q)}&page=${state.page}&limit=${state.limit}`);
  const grid = document.getElementById("grid");
  if(!data.data.length){
    grid.innerHTML = `<div class="muted" style="font-weight:1000">محصولی یافت نشد.</div>`;
  } else {
    grid.innerHTML = data.data.map(productCard).join("");
  }
  renderPager({ mountId:"pager", page:data.page, totalPages:data.totalPages, limit:data.limit,
    onChange:({page,limit})=>{ state.page=page; state.limit=limit; load(); }});
}

document.addEventListener("click",(e)=>{
  if(e.target?.id==="btnSearch"){
    state.q = el("q").value.trim();
    state.page = 1;
    load();
  }
});

load();
</script>

  </div>

  <script>
    async function injectPartial(selector, url){
      const el = document.querySelector(selector);
      if(!el) return;
      el.innerHTML = await (await fetch(url)).text();
    }
  </script>
  <script src="./content/js/modal.js"></script>
  <script src="./content/js/pagination.js"></script>
  <script src="./content/js/site.js"></script>
  <script>
    (async ()=>{
      await injectPartial("#headerMount","./partials/site-header.html");
      await refreshHeader();
    })();
  </script>
  <script>
function openAuthModal(){
  openModal({
    title:"ورود / ثبت نام",
    bodyHTML: `
      <div class="grid2">
        <input class="input" id="aFirstname" placeholder="نام (برای ثبت نام)">
        <input class="input" id="aLastname" placeholder="نام خانوادگی (برای ثبت نام)">
        <input class="input" id="aUsername" placeholder="نام کاربری">
        <input class="input" id="aPassword" placeholder="رمز عبور" type="password">
        <input class="input" id="aPhone" placeholder="شماره تماس (اختیاری)">
        <input class="input" id="aEmail" placeholder="ایمیل (اختیاری)">
      </div>
      <p class="muted" style="margin:12px 0 0;font-weight:800">
        برای ورود فقط «نام کاربری» و «رمز عبور» کافی است. برای ثبت نام، نام و نام خانوادگی را هم پر کنید.
      </p>
      <div class="actions" style="margin-top:12px">
        <button class="btn" id="loginBtn">ورود</button>
        <button class="btn light" id="registerBtn">ثبت نام</button>
      </div>
    `,
    confirmText:"بستن",
    onConfirm: ()=>{}
  });

  setTimeout(()=>{
    document.getElementById("loginBtn")?.addEventListener("click", async ()=>{
      try{
        const username = document.getElementById("aUsername").value.trim();
        const password = document.getElementById("aPassword").value.trim();
        const res = await apiSend("/api/auth/login","POST",{ username, password });
        localStorage.setItem("token", res.token);
        await refreshHeader();
        openModal({ title:"موفق", bodyHTML:`<p style="margin:0;font-weight:900">وارد شدید ✅</p>`, confirmText:"اوکی" });
      }catch(e){
        openModal({ title:"خطا", bodyHTML:`<p style="margin:0;font-weight:900">${e.message}</p>`, confirmText:"باشه" });
      }
    });

    document.getElementById("registerBtn")?.addEventListener("click", async ()=>{
      try{
        const payload = {
          firstname: document.getElementById("aFirstname").value.trim(),
          lastname: document.getElementById("aLastname").value.trim(),
          username: document.getElementById("aUsername").value.trim(),
          password: document.getElementById("aPassword").value.trim(),
          phone: document.getElementById("aPhone").value.trim() || null,
          email: document.getElementById("aEmail").value.trim() || null
        };
        const res = await apiSend("/api/auth/register","POST",payload);
        localStorage.setItem("token", res.token);
        await refreshHeader();
        openModal({ title:"موفق", bodyHTML:`<p style="margin:0;font-weight:900">ثبت نام انجام شد ✅</p>`, confirmText:"اوکی" });
      }catch(e){
        openModal({ title:"خطا", bodyHTML:`<p style="margin:0;font-weight:900">${e.message}</p>`, confirmText:"باشه" });
      }
    });
  }, 0);
}

document.addEventListener("click", (e)=>{
  if(e.target?.id === "openAuth"){
    openAuthModal();
  }
});
</script>

</body>
</html>
